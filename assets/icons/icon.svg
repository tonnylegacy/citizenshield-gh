<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield Shape -->
  <path d="M256 32 L448 96 V256 C448 376 364 456 256 480 C148 456 64 376 64 256 V96 Z" fill="url(#shieldGrad)" stroke="#10B981" stroke-width="8"/>
  
  <!-- Outer Gold Rim -->
  <path d="M256 56 L424 112 V256 C424 360 348 434 256 456 C164 434 88 360 88 256 V112 Z" fill="#050B14" opacity="0.85"/>
  
  <!-- Balance of Justice Scales -->
  <!-- Center Pillar -->
  <rect x="250" y="140" width="12" height="210" rx="6" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Base Pedestal -->
  <path d="M206 350 L306 350 L316 366 L196 366 Z" fill="url(#goldGrad)"/>
  <!-- Top Finial / Star -->
  <polygon points="256,110 263,126 280,126 266,136 271,152 256,142 241,152 246,136 232,126 249,126" fill="#FCD34D"/>
  
  <!-- Balance Crossbar -->
  <rect x="156" y="165" width="200" height="8" rx="4" fill="url(#goldGrad)"/>
  <circle cx="256" cy="169" r="8" fill="#F59E0B"/>
  
  <!-- Left Pan & Strings -->
  <line x1="170" y1="173" x2="140" y2="230" stroke="#FCD34D" stroke-width="3"/>
  <line x1="170" y1="173" x2="200" y2="230" stroke="#FCD34D" stroke-width="3"/>
  <path d="M130 230 C130 250 210 250 210 230 Z" fill="url(#goldGrad)"/>
  
  <!-- Right Pan & Strings -->
  <line x1="342" y1="173" x2="312" y2="230" stroke="#FCD34D" stroke-width="3"/>
  <line x1="342" y1="173" x2="372" y2="230" stroke="#FCD34D" stroke-width="3"/>
  <path d="M302 230 C302 250 382 250 382 230 Z" fill="url(#goldGrad)"/>
</svg>
